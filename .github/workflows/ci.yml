name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions – individual jobs escalate only what they need.
permissions:
  contents: read

env:
  PNPM_VERSION: '11.0.9'
  GO_VERSION: '1.24'
  RUST_TOOLCHAIN: '1.94.1'
  NODE_VERSION: '24'

jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages (PR range)
        if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }}

      - name: Lint latest commit message (push)
        if: github.event_name == 'push'
        run: git log -1 --pretty=%B | pnpm commitlint

  # ---------------------------------------------------------------------------
  # TypeScript: lint · typecheck · audit · test
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit (security)
        # tar@6.x false-positives: GHSA-{34x7,8qq5,83g3,qffp,9ppj,r6q2} target
        # code paths introduced only in tar@7.x — @expo/cli requires ^6.2.1 and
        # is not affected by those advisories.
        # shell: bash avoids PowerShell \ continuation errors on windows-latest.
        shell: bash
        run: |
          pnpm audit --audit-level=moderate \
            --ignore GHSA-34x7-hfp2-rc4v \
            --ignore GHSA-8qq5-rm4j-mr97 \
            --ignore GHSA-83g3-92jg-28cx \
            --ignore GHSA-qffp-2rhf-9h96 \
            --ignore GHSA-9ppj-qmqm-q256 \
            --ignore GHSA-r6q2-hw4h-h46w
        continue-on-error: false

  # ---------------------------------------------------------------------------
  # Go: vet · build · test (race+short) · govulncheck · golangci-lint
  # ---------------------------------------------------------------------------
  golang:
    name: Go ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        module:
          - runtime/protocol/go-rpc-bridge
          - runtime/gxqs-runtime
          - runtime/policy-engine
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '${{ matrix.module }}/go.sum'

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go test (race + short)
        working-directory: ${{ matrix.module }}
        run: go test -race -short -count=1 -timeout=120s ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
        # All detected CVEs are in the Go standard library (net, crypto/tls,
        # crypto/x509, os, net/url) and are fixed only in go1.25.x.  We are
        # intentionally pinned to go1.24 for this release; govulncheck is kept
        # as a reporting gate rather than a hard blocker until the toolchain
        # is bumped to a version that includes the fixes.
        continue-on-error: true


  # ---------------------------------------------------------------------------
  # Rust: clippy · test · cargo audit
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/crypto/gxqs-wallet-core-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo clippy
        working-directory: runtime/crypto/gxqs-wallet-core-rs
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: runtime/crypto/gxqs-wallet-core-rs
        run: cargo test --all-features

      - name: cargo fmt check
        working-directory: runtime/crypto/gxqs-wallet-core-rs
        run: cargo fmt -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        env:
          CARGO_NET_RETRY: '5'

      - name: cargo audit
        # Run from the workspace root so cargo-audit can find Cargo.lock.
        working-directory: runtime/crypto
        run: cargo audit

  # ---------------------------------------------------------------------------
  # WASM: build gxqs-wallet-core-rs for wasm32-unknown-unknown
  # ---------------------------------------------------------------------------
  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/crypto/gxqs-wallet-core-rs/target
          key: wasm-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build WASM
        working-directory: runtime/crypto/gxqs-wallet-core-rs
        run: cargo build --target wasm32-unknown-unknown --release --features wasm

  # ---------------------------------------------------------------------------
  # Format check across all languages
  # ---------------------------------------------------------------------------
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt check
        run: |
          gofmt_files=$(gofmt -l runtime/protocol/go-rpc-bridge runtime/gxqs-runtime runtime/policy-engine)
          if [ -n "$gofmt_files" ]; then
            echo "Files need gofmt: $gofmt_files"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: rustfmt check
        working-directory: runtime/crypto/gxqs-wallet-core-rs
        run: cargo fmt -- --check

  # ---------------------------------------------------------------------------
  # SBOM: generate software bill of materials (main branch pushes only)
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          artifact-name: gxqs-platform-sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true

