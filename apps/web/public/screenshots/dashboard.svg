<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe1"/>
      <stop offset="100%" style="stop-color:#7a00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffe1" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="rgba(0,255,225,0.05)" filter="url(#glow)"/>
  <text x="20" y="38" font-family="monospace" font-size="20" fill="#00ffe1" font-weight="bold">GXQS Runtime Platform</text>

  <!-- Top stats -->
  <rect x="20" y="75" width="280" height="80" rx="8" fill="rgba(0,255,225,0.05)" stroke="#00ffe1" stroke-width="1"/>
  <text x="40" y="105" font-family="monospace" font-size="12" fill="#00ffe1">TPS</text>
  <text x="40" y="135" font-family="monospace" font-size="28" fill="#00ffe1" filter="url(#glow)">5,247</text>

  <rect x="310" y="75" width="280" height="80" rx="8" fill="rgba(0,255,225,0.05)" stroke="#00ffe1" stroke-width="1"/>
  <text x="330" y="105" font-family="monospace" font-size="12" fill="#00ffe1">BLOCK HEIGHT</text>
  <text x="330" y="135" font-family="monospace" font-size="28" fill="#00ffe1" filter="url(#glow)">892,341</text>

  <rect x="600" y="75" width="280" height="80" rx="8" fill="rgba(0,255,225,0.05)" stroke="#00ffe1" stroke-width="1"/>
  <text x="620" y="105" font-family="monospace" font-size="12" fill="#00ffe1">FINALITY</text>
  <text x="620" y="135" font-family="monospace" font-size="28" fill="#00ffe1" filter="url(#glow)">≤ 2s</text>

  <rect x="890" y="75" width="280" height="80" rx="8" fill="rgba(0,255,225,0.05)" stroke="#00ffe1" stroke-width="1"/>
  <text x="910" y="105" font-family="monospace" font-size="12" fill="#00ffe1">VALIDATORS</text>
  <text x="910" y="135" font-family="monospace" font-size="28" fill="#00ffe1" filter="url(#glow)">127</text>

  <!-- Chart area -->
  <rect x="20" y="170" width="1160" height="250" rx="8" fill="rgba(0,255,225,0.03)" stroke="#00ffe1" stroke-width="0.5"/>
  <text x="40" y="195" font-family="monospace" font-size="12" fill="#00ffe1">▼ LIVE TPS CHART</text>

  <!-- Chart line -->
  <polyline points="40,380 100,370 160,350 220,320 280,280 340,290 400,250 460,260 520,230 580,210 640,190 700,200 760,175 820,185 880,195 940,210 1000,230 1060,240 1120,260" fill="none" stroke="#00ffe1" stroke-width="2" filter="url(#glow)"/>

  <!-- Bottom panel -->
  <rect x="20" y="435" width="560" height="220" rx="8" fill="rgba(0,255,225,0.03)" stroke="#00ffe1" stroke-width="0.5"/>
  <text x="40" y="460" font-family="monospace" font-size="12" fill="#00ffe1">▼ RECENT BLOCKS</text>

  <!-- Block rows -->
  <rect x="40" y="475" width="520" height="25" rx="4" fill="rgba(0,255,225,0.05)"/>
  <text x="55" y="492" font-family="monospace" font-size="11" fill="#888">#892341  •  0x7f3a...e2d1  •  1,247 txs  •  0.48s ago</text>

  <rect x="40" y="505" width="520" height="25" rx="4" fill="rgba(0,255,225,0.03)"/>
  <text x="55" y="522" font-family="monospace" font-size="11" fill="#888">#892340  •  0x1b9e...7c4a  •  1,198 txs  •  0.92s ago</text>

  <rect x="40" y="535" width="520" height="25" rx="4" fill="rgba(0,255,225,0.05)"/>
  <text x="55" y="552" font-family="monospace" font-size="11" fill="#888">#892339  •  0x4d2a...9f3b  •  1,312 txs  •  1.41s ago</text>

  <rect x="40" y="565" width="520" height="25" rx="4" fill="rgba(0,255,225,0.03)"/>
  <text x="55" y="582" font-family="monospace" font-size="11" fill="#888">#892338  •  0x8c6f...2a7e  •  1,056 txs  •  1.89s ago</text>

  <rect x="40" y="595" width="520" height="25" rx="4" fill="rgba(0,255,225,0.05)"/>
  <text x="55" y="612" font-family="monospace" font-size="11" fill="#888">#892337  •  0x3e1b...5d2c  •  1,423 txs  •  2.37s ago</text>

  <!-- Right panel -->
  <rect x="600" y="435" width="580" height="220" rx="8" fill="rgba(0,255,225,0.03)" stroke="#00ffe1" stroke-width="0.5"/>
  <text x="620" y="460" font-family="monospace" font-size="12" fill="#00ffe1">▼ MEMPOOL</text>

  <rect x="620" y="475" width="540" height="25" rx="4" fill="rgba(255,0,0,0.1)"/>
  <text x="635" y="492" font-family="monospace" font-size="11" fill="#ff6b6b">⚠️ 247 high-priority transactions</text>

  <rect x="620" y="505" width="540" height="25" rx="4" fill="rgba(255,170,0,0.08)"/>
  <text x="635" y="522" font-family="monospace" font-size="11" fill="#ffaa00">⚠️ 1,892 medium-priority transactions</text>

  <rect x="620" y="535" width="540" height="25" rx="4" fill="rgba(0,255,225,0.05)"/>
  <text x="635" y="552" font-family="monospace" font-size="11" fill="#00ffe1">✓ 5,123 low-priority transactions</text>

  <!-- Neon accent line -->
  <rect x="0" y="670" width="1200" height="5" fill="url(#neon)" filter="url(#glow)"/>
</svg>
