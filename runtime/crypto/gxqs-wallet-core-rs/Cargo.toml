[package]
name = "gxqs-wallet-core-rs"
version = "0.1.0"
edition = "2021"
description = "GXQS cryptographic core – encrypted vault, address derivation, WASM bindings"
license = "MIT"
repository = "https://github.com/GXQS/Wallet"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["wasm-bindgen", "js-sys", "getrandom/js"]

[dependencies]
sha2 = "0.11"
ripemd = "0.2"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.10.2"
getrandom = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
serde_json = "1"
base64 = "0.22"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
hex-literal = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
