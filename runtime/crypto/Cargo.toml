[workspace]
resolver = "2"
members = [
    "gxqs-wallet-core-rs",
]

[workspace.package]
authors = ["GXQS Platform Team"]
license = "MIT"
repository = "https://github.com/GXQS/Wallet"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
