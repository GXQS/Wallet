---
# ---------------------------------------------------------------------------
# walletd Kubernetes Deployment
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: walletd
  namespace: gxqs
  labels:
    app.kubernetes.io/name: walletd
    app.kubernetes.io/component: protocol-bridge
    app.kubernetes.io/part-of: gxqs-platform
    app.kubernetes.io/version: '0.1.0'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: walletd
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: walletd
        app.kubernetes.io/component: protocol-bridge
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8545'
        prometheus.io/path: '/metrics'
    spec:
      # Run as non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: walletd
          image: gxqs/walletd:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: rpc
              containerPort: 8545
              protocol: TCP
          env:
            - name: WALLETD_RPC_PORT
              value: '8545'
            - name: GXQS_NETWORK
              valueFrom:
                configMapKeyRef:
                  name: gxqs-config
                  key: network
            - name: GXQS_CORE_RPC
              valueFrom:
                configMapKeyRef:
                  name: gxqs-config
                  key: core_rpc_url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: rpc
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault-storage
              mountPath: /data/vault
      volumes:
        - name: vault-storage
          persistentVolumeClaim:
            claimName: walletd-vault-pvc
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: walletd
  namespace: gxqs
  labels:
    app.kubernetes.io/name: walletd
spec:
  selector:
    app.kubernetes.io/name: walletd
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: walletd-vault-pvc
  namespace: gxqs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
