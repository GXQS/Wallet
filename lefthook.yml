pre-commit:
  commands:
    generated-file-guard:
      run: pnpm generated:guard
    format-write-staged:
      run: pnpm format:staged
      stage_fixed: true
    format-check-staged:
      run: pnpm format:check:staged
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
