pre-commit:
  commands:
    format-write-staged:
      run: pnpm format:staged
      stage_fixed: true
    format-check:
      run: pnpm format:check
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
