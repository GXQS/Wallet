packages:
  - 'apps/*'
  - 'packages/*'
  - 'runtime/protocol/go-rpc-bridge'
allowBuilds:
  core-js-pure: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-34x7-hfp2-rc4v
    - GHSA-8qq5-rm4j-mr97
    - GHSA-83g3-92jg-28cx
    - GHSA-qffp-2rhf-9h96
    - GHSA-9ppj-qmqm-q256
    - GHSA-r6q2-hw4h-h46w
minimumReleaseAgeExclude:
  - postcss@8.5.10
  - '@xmldom/xmldom@0.8.13'
overrides:
  'postcss@<8.5.10': ^8.5.10
  '@xmldom/xmldom@<0.8.13': ^0.8.13
